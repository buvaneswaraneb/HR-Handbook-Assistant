services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8000
      PYTHONPATH: /app/backend
      HR_ASSISTANT_RUNTIME_DIR: /app/.runtime
    ports:
      - "8000:8000"
    volumes:
      - osmium-runtime:/app/.runtime
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  osmium-runtime:
