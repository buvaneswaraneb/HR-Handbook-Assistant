name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -R frontend/osmium/. pages-dist/
          cp pages-dist/index.html pages-dist/app.html
          cp pages-dist/landing.html pages-dist/index.html
          python3 - <<'PY'
          from pathlib import Path

          index = Path("pages-dist/index.html")
          html = index.read_text()
          html = html.replace('href="index.html"', 'href="app.html"')
          index.write_text(html)
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
